# Builds the Windows setup file on GitHub's free Windows computer.
# PyInstaller and Inno Setup only build Windows apps ON Windows.
# A Linux/Mac computer cannot make BRollFinder-Setup.exe.
# Cost: free for a public repo. For a private repo, GitHub's free plan
# includes 2,000 Actions minutes a month; this build uses roughly 10-20.
name: Build Windows installer

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Private = BRAIN tab visible (for you). Public = BRAIN tab hidden and brain locked (for others)."
        type: choice
        options: [private, public]
        default: private
  push:
    tags: ["v*"]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Run tests
        run: python -m pytest tests -q

      # Private (default) keeps engine/build_mode.py as PUBLIC_BUILD=False.
      # Public overwrites it in the runner ONLY (never committed) so the
      # built app hides the BRAIN tab and locks the brain APIs, while
      # scans still use the embedded brain.
      - name: Set build variant
        shell: pwsh
        run: |
          if ("${{ inputs.build_type }}" -eq "public") {
            "PUBLIC_BUILD = True" | Out-File -Encoding utf8 engine\build_mode.py
          } else {
            "PUBLIC_BUILD = False" | Out-File -Encoding utf8 engine\build_mode.py
          }
          Get-Content engine\build_mode.py

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Build app with PyInstaller
        env:
          BROLL_PUBLIC_BUILD: ${{ inputs.build_type == 'public' && '1' || '0' }}
        run: pyinstaller broll_finder.spec

      - name: Download ffmpeg, yt-dlp and WebView2 bootstrapper
        shell: pwsh
        run: |
          $dist = "dist\BRollFinder"
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile "$env:TEMP\ffmpeg.zip"
          Expand-Archive "$env:TEMP\ffmpeg.zip" -DestinationPath "$env:TEMP\ffmpeg" -Force
          Copy-Item "$env:TEMP\ffmpeg\ffmpeg-*-essentials_build\bin\ffmpeg.exe" "$dist\ffmpeg.exe"
          Invoke-WebRequest -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile "$dist\yt-dlp.exe"
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile "installer\MicrosoftEdgeWebview2Setup.exe"

      # OPTIONAL signing: only runs if you add these GitHub Secrets later.
      # Without them the build still succeeds, but the .exe is UNSIGNED
      # (SmartScreen warning; Smart App Control PCs may block it).
      # Secrets needed: WINDOWS_CERT_PFX (base64 .pfx), WINDOWS_CERT_PASSWORD.
      - name: Code-sign (optional, if secrets are set)
        if: env.WINDOWS_CERT_PFX != ''
        shell: pwsh
        env:
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $pfx = "$env:TEMP\cert.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env.WINDOWS_CERT_PFX))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -First 1 -ExpandProperty FullName
          Get-ChildItem -Recurse -Include *.exe,*.dll dist\BRollFinder | ForEach-Object {
            & $signtool sign /f $pfx /p $env:WINDOWS_CERT_PASSWORD /fd sha256 /tr http://timestamp.digicert.com /td sha256 $_.FullName
          }

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\broll_finder.iss
          Get-ChildItem installer-output\

      - name: Upload setup file
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.build_type == 'public' && 'BRollFinder-Setup-Public' || 'BRollFinder-Setup' }}
          path: installer-output/BRollFinder-Setup-*.exe
          if-no-files-found: error
